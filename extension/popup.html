<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body { font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; width: 300px; margin: 0; padding: 14px; background: #0f1011; color: #e6e8eb; }
      h1 { font-size: 14px; margin: 0 0 4px; }
      p { color: #8a8f98; margin: 0 0 12px; line-height: 1.45; }
      label { display: block; font-size: 12px; color: #8a8f98; margin: 10px 0 4px; }
      input { width: 100%; box-sizing: border-box; padding: 7px 9px; border-radius: 6px; border: 1px solid #2a2b2f; background: #141516; color: #f7f8f8; font: inherit; }
      button { margin-top: 12px; width: 100%; padding: 8px; border: 0; border-radius: 6px; background: #5e6ad2; color: white; font-weight: 600; cursor: pointer; }
      .status { margin-top: 12px; font-size: 12px; display: flex; gap: 8px; align-items: center; }
      .dot { width: 8px; height: 8px; border-radius: 50%; background: #62666d; }
      .dot.on { background: #4cb782; }
    </style>
  </head>
  <body>
    <h1>YouHired</h1>
    <p>Paste the pairing code from YouHired → Settings → Your Chrome. The extension only talks to YouHired on this computer.</p>
    <label for="server">YouHired address</label>
    <input id="server" value="http://localhost:5173" />
    <label for="code">Pairing code</label>
    <input id="code" placeholder="Paste the code" autocomplete="off" />
    <button id="save">Connect</button>
    <div class="status"><span class="dot" id="dot"></span><span id="msg">Not connected</span></div>
    <script src="popup.js"></script>
  </body>
</html>
